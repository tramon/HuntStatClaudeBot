name: HuntStatClaudeBot

# Бот крутиться як "естафета" 6-годинних запусків:
#   • кожен запуск працює ~5h45m, сам перезапускає bot.py при падінні
#     (scripts/run_bot.sh), а наприкінці сам запускає наступний запуск;
#   • наступний стає в чергу й стартує, щойно поточний завершився — без дірок
#     і без залежності від cron (cron у GitHub запізнюється на години);
#   • якщо ланцюжок все ж обірвався — його піднімає watchdog.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      handover:
        description: "Службове: автоматична передача естафети (вручну не вмикати)"
        type: boolean
        default: false

concurrency:
  group: bot-runner
  # push і ручний запуск = свідомий перезапуск -> замінюють працюючий бот одразу.
  # handover (від попереднього запуску або watchdog) -> стає в чергу й чекає,
  # поки поточний завершиться, нічого не обриваючи.
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.handover != true) }}

permissions:
  contents: read
  actions: write   # потрібно, щоб запустити наступний запуск

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # жорстка межа GitHub — 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (з автоперезапуском)
        run: bash scripts/run_bot.sh
        env:
          BOT_MAX_SECONDS: "20700"   # 5h45m, далі передаємо естафету
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          CLAUDE_MEMORY: ${{ secrets.CLAUDE_MEMORY }}
          CONTEXT_MESSAGES: ${{ secrets.CONTEXT_MESSAGES }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          CLAUDE_EFFORT: ${{ secrets.CLAUDE_EFFORT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      # Лише при нормальному завершенні (не при скасуванні через push/ручний
      # перезапуск і не при помилці конфігурації).
      - name: Hand over to next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f handover=true
